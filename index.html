<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINIMAL</title><style>body{margin:0;background:#050505;color:white;font-family:-apple-system;text-align:center;padding:20px}.clock{margin-top:25vh;font-size:90px;font-weight:200;letter-spacing:-5px}.date{color:#888;font-size:15px;letter-spacing:2px;margin-top:15px}.line{height:1px;background:#333;margin:60px 0 30px}.label{color:#777;letter-spacing:4px;font-size:11px}.apps{position:fixed;bottom:45px;left:0;right:0;display:flex;justify-content:space-evenly}.apps a{color:white;text-decoration:none;font-size:12px}.apps span{display:block;font-size:27px;margin-bottom:10px}</style></head><body><div class="label">MINIMAL DESIGN</div><div class="clock" id="clock">00:00</div><div class="date" id="date"></div><div class="line"></div><div class="label">LESS IS MORE</div><div class="apps"><a href="tel:"><span>◯</span>PHONE</a><a href="sms:"><span>□</span>MESSAGES</a><a href="https://www.google.com"><span>⌕</span>SEARCH</a><a href="https://www.apple.com"><span>○</span>MORE</a></div><script>function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,1000);</script></body></html>
